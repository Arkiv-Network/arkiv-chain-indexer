<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arkiv BlockExplorer</title>
    <!-- Preload the self-hosted fonts so text renders in its final face at
         first paint; a late font swap reflows the layout (CLS). The
         crossorigin attribute is required for font preloads to be reused. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-v22-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-v24-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
