# Read-only full/light panels. Explorer and producer sites are configured separately.
limit_req_zone $binary_remote_addr zone=arkiv_panel:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=arkiv_panel_conn:10m;
server {
    listen 80;
    listen [::]:80;
    server_name fullnode.experimental.arkiv-global.net lightnode.experimental.arkiv-global.net;
    location /.well-known/acme-challenge/ { root /var/www/arkiv-node-panels; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fullnode.experimental.arkiv-global.net;
    ssl_certificate /etc/letsencrypt/live/fullnode.experimental.arkiv-global.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullnode.experimental.arkiv-global.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /node-sim/ {
        limit_req zone=arkiv_panel burst=20 nodelay;
        limit_conn arkiv_panel_conn 8;
        proxy_pass http://127.0.0.1:23572;
        proxy_http_version 1.1;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:23572;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lightnode.experimental.arkiv-global.net;
    ssl_certificate /etc/letsencrypt/live/fullnode.experimental.arkiv-global.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullnode.experimental.arkiv-global.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /node-sim/ {
        limit_req zone=arkiv_panel burst=20 nodelay;
        limit_conn arkiv_panel_conn 8;
        proxy_pass http://127.0.0.1:23573;
        proxy_http_version 1.1;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:23573;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
