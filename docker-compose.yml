x-extra-hosts: &extra-hosts
  - "host.docker.internal:${HOST_GATEWAY_IP:-0.0.0.0}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gas}
      POSTGRES_DB: ${POSTGRES_DB:-gas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Arkiv-Network/arkiv-transaction-decoder (Bun) microservice used by the
  # scanners to decode Arkiv registry execute() calldata into operation metadata.
  # It reads the tagged-union format the chain carries today (selector
  # 0x49650044) as well as the older struct format still sitting in historical
  # blocks, and reports a payload as its size alone — entity payload bytes never
  # leave it. PORT puts it on 28884, matching the DECODER_URL defaults below.
  #
  # The decoder it replaced only knew the struct format, and so refused every
  # registry call the chain now makes. This one does not parse v1 payload
  # references, so is_reference / payload_reference / reference_verification
  # stay unset until it learns to.
  decoder:
    image: ${ARKIV_DECODER_IMAGE:-ghcr.io/arkiv-network/arkiv-transaction-decoder:v0.2.1}
    environment:
      PORT: 28884
    restart: unless-stopped

  # Arkiv-Network/api-key-generator: mints Arkiv Hub devnet API keys on demand by
  # driving the Hub's SIWE login + Cap.js captcha in a headless Chromium. Baseload
  # calls it once per worker so each worker hammers the RPC on its own key (and so
  # its own rate-limit bucket) instead of the whole fleet sharing one.
  #
  # It carries a browser, so it only starts when asked for: put
  # COMPOSE_PROFILES=rpc-keys in .env (alongside BASELOAD_RPC_KEY_SERVICE_URL).
  arkiv-keys:
    image: ${ARKIV_KEY_GENERATOR_IMAGE:-ghcr.io/arkiv-network/api-key-generator:latest}
    profiles: ["rpc-keys"]
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      decoder:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SCANNER_RPC_FULL_NODE: ${SCANNER_RPC_FULL_NODE}
      SCANNER_RPC_API_KEY: ${SCANNER_RPC_API_KEY:-}
      # Rotating key pool (see scripts/provisionRpcKeys.ts). Overrides the single
      # key above when the file holds more than one key.
      RPC_KEY_POOL_FILE: ${RPC_KEY_POOL_FILE:-}
      DECODER_URL: ${DECODER_URL-http://decoder:28884}
      # The scanner container only ever scans forward from the safe head.
      SCANNER_DISABLE_BACKFILL: true
      SCANNER_CONFIRMATION_DEPTH: ${SCANNER_CONFIRMATION_DEPTH:-3}
      SCANNER_POLL_MS: ${SCANNER_POLL_MS:-2000}
      SCANNER_RETRY_MS: ${SCANNER_RETRY_MS:-5000}
      # Legacy no-op: receipts are fetched sequentially (see README).
      SCANNER_TX_RECEIPT_CONCURRENCY: ${SCANNER_TX_RECEIPT_CONCURRENCY:-20}
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
    volumes:
      - ${RPC_KEY_DIR:-./rpc-keys}:/app/rpc-keys:ro
    extra_hosts: *extra-hosts
    command: ["bun", "run", "scan"]

  backfill-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      decoder:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      SCANNER_RPC_FULL_NODE: ${SCANNER_RPC_FULL_NODE}
      SCANNER_RPC_API_KEY: ${SCANNER_RPC_API_KEY:-}
      # Rotating key pool (see scripts/provisionRpcKeys.ts). Overrides the single
      # key above when the file holds more than one key.
      RPC_KEY_POOL_FILE: ${RPC_KEY_POOL_FILE:-}
      DECODER_URL: ${DECODER_URL-http://decoder:28884}
      SCANNER_BACKFILL_ONLY: "true"
      # Master switch: when true (the default) this container idles and does no
      # backfill. Set SCANNER_DISABLE_BACKFILL=false in .env to run the backfill.
      SCANNER_DISABLE_BACKFILL: ${SCANNER_DISABLE_BACKFILL:-true}
      SCANNER_OLDEST_BACKFILL_BLOCK: ${SCANNER_OLDEST_BACKFILL_BLOCK:-25000000}
      SCANNER_BACKFILL_SLEEP_MS: ${SCANNER_BACKFILL_SLEEP_MS:-100}
      SCANNER_CONFIRMATION_DEPTH: ${SCANNER_CONFIRMATION_DEPTH:-3}
      SCANNER_POLL_MS: ${SCANNER_POLL_MS:-2000}
      SCANNER_RETRY_MS: ${SCANNER_RETRY_MS:-5000}
      # Legacy no-op: receipts are fetched sequentially (see README).
      SCANNER_TX_RECEIPT_CONCURRENCY: ${SCANNER_TX_RECEIPT_CONCURRENCY:-20}
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
    volumes:
      - ${RPC_KEY_DIR:-./rpc-keys}:/app/rpc-keys:ro
    extra_hosts: *extra-hosts
    command: ["bun", "run", "scan"]

  batcher-collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      BATCHER_COLLECTOR_URL: ${BATCHER_COLLECTOR_URL:-}
      BATCHER_COLLECTOR_INTERVAL_MS: ${BATCHER_COLLECTOR_INTERVAL_MS:-10000}
    extra_hosts: *extra-hosts
    command:
      - sh
      - -c
      - |
        if [ -z "$${BATCHER_COLLECTOR_URL}" ]; then
          echo 'BATCHER_COLLECTOR_URL is not set; batcher collector service disabled'
          while true; do sleep 3600; done
        fi
        bun run collect-batcher

  aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      AGGREGATE_INTERVAL_MS: ${AGGREGATE_INTERVAL_MS:-30000}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "aggregate-all"]

  sender-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      SENDER_AGGREGATE_INTERVAL_MS: ${SENDER_AGGREGATE_INTERVAL_MS:-60000}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "aggregate-senders"]

  gap-filler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      decoder:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      SCANNER_RPC_FULL_NODE: ${SCANNER_RPC_FULL_NODE}
      SCANNER_RPC_API_KEY: ${SCANNER_RPC_API_KEY:-}
      # Rotating key pool (see scripts/provisionRpcKeys.ts). Overrides the single
      # key above when the file holds more than one key.
      RPC_KEY_POOL_FILE: ${RPC_KEY_POOL_FILE:-}
      DECODER_URL: ${DECODER_URL-http://decoder:28884}
      GAP_FILL_INTERVAL_MS: ${GAP_FILL_INTERVAL_MS:-60000}
      GAP_FILL_MAX_BLOCKS_PER_CYCLE: ${GAP_FILL_MAX_BLOCKS_PER_CYCLE:-500}
      GAP_FILL_BLOCK_SLEEP_MS: ${GAP_FILL_BLOCK_SLEEP_MS:-50}
      GAP_FILL_RETRY_MS: ${GAP_FILL_RETRY_MS:-5000}
      GAP_FILL_MAX_RETRIES: ${GAP_FILL_MAX_RETRIES:-5}
      # Legacy no-op: receipts are fetched sequentially (see README).
      SCANNER_TX_RECEIPT_CONCURRENCY: ${SCANNER_TX_RECEIPT_CONCURRENCY:-20}
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
    volumes:
      - ${RPC_KEY_DIR:-./rpc-keys}:/app/rpc-keys:ro
    extra_hosts: *extra-hosts
    command: ["bun", "run", "fill-gaps"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVER_PORT: 3000
      SERVER_HOSTNAME: 0.0.0.0
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
      # Entity history slice + response cache; empty values fall back to the
      # backend defaults (100 ops / 10k entries / 64 MiB / 5 min TTL).
      ENTITY_HISTORY_LIMIT: ${ENTITY_HISTORY_LIMIT:-}
      ENTITY_CACHE_MAX_ENTRIES: ${ENTITY_CACHE_MAX_ENTRIES:-}
      ENTITY_CACHE_MAX_BYTES: ${ENTITY_CACHE_MAX_BYTES:-}
      ENTITY_CACHE_TTL_MS: ${ENTITY_CACHE_TTL_MS:-}
      # Precomputed /sync + blocks/ranges response cache; empty values fall
      # back to the backend defaults (5s refresh / 200 entries / 64 MiB / 5s TTL).
      SYNC_REFRESH_MS: ${SYNC_REFRESH_MS:-}
      LIST_CACHE_MAX_ENTRIES: ${LIST_CACHE_MAX_ENTRIES:-}
      LIST_CACHE_MAX_BYTES: ${LIST_CACHE_MAX_BYTES:-}
      LIST_CACHE_TTL_MS: ${LIST_CACHE_TTL_MS:-}
      BASELOAD_RPC_NODE: ${BASELOAD_RPC_NODE:-}
      BASELOAD_MNEMONIC: ${BASELOAD_MNEMONIC:-}
      BASELOAD_ADMIN_BEARER_TOKEN: ${BASELOAD_ADMIN_BEARER_TOKEN:-}
      BASELOAD_INITIAL_CONFIG_PATH: ${BASELOAD_INITIAL_CONFIG_PATH:-}
      BASELOAD_FAUCET_URL: ${BASELOAD_FAUCET_URL:-}
      BASELOAD_FAUCET_PASSWORD: ${BASELOAD_FAUCET_PASSWORD:-}
      BASELOAD_FAUCET_MIN_BALANCE: ${BASELOAD_FAUCET_MIN_BALANCE:-}
      BASELOAD_FAUCET_MAX_BALANCE: ${BASELOAD_FAUCET_MAX_BALANCE:-}
      BASELOAD_FAUCET_DRIP_AMOUNT: ${BASELOAD_FAUCET_DRIP_AMOUNT:-}
      BASELOAD_FAUCET_COOLDOWN_SECONDS: ${BASELOAD_FAUCET_COOLDOWN_SECONDS:-}
      # Per-worker RPC keys. Empty (the default) keeps every worker on the single
      # key baked into BASELOAD_RPC_NODE.
      BASELOAD_RPC_KEY_SERVICE_URL: ${BASELOAD_RPC_KEY_SERVICE_URL:-}
      BASELOAD_RPC_KEY_PLACEMENT: ${BASELOAD_RPC_KEY_PLACEMENT:-}
      BASELOAD_RPC_KEY_HEADER: ${BASELOAD_RPC_KEY_HEADER:-}
      BASELOAD_RPC_KEY_NAME_PREFIX: ${BASELOAD_RPC_KEY_NAME_PREFIX:-}
      BASELOAD_RPC_KEY_STORE: ${BASELOAD_RPC_KEY_STORE:-/app/baseload-keys/rpc-keys.json}
      BASELOAD_RPC_KEY_TIMEOUT_SECONDS: ${BASELOAD_RPC_KEY_TIMEOUT_SECONDS:-}
      RPC_KEY_POOL_FILE: ${RPC_KEY_POOL_FILE:-}
      ARKIV_PROTOCOL_SCHEDULE_URL: ${ARKIV_PROTOCOL_SCHEDULE_URL:-}
      ARKIV_PROTOCOL_SCHEDULE_PATH: ${ARKIV_PROTOCOL_SCHEDULE_PATH:-}
      PAYLOAD_PROVIDER_PAYMENT_SHARE_BPS: ${PAYLOAD_PROVIDER_PAYMENT_SHARE_BPS:-}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ${BASELOAD_CONFIG_DIR:-./baseload-config}:/app/baseload-config:ro
      # baseload-config is read-only, so minted keys get their own writable volume;
      # keeping it across restarts saves a captcha solve per worker.
      - baseloadkeys:/app/baseload-keys
      - ${RPC_KEY_DIR:-./rpc-keys}:/app/rpc-keys:ro
    extra_hosts: *extra-hosts
    command: ["bun", "run", "serve"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CHAIN_NAME: ${VITE_CHAIN_NAME:-Arkiv}
        VITE_TOKEN_SYMBOL: ${VITE_TOKEN_SYMBOL:-ETH}
        VITE_TRANSACTION_DECODER_BASE_URL: ${VITE_TRANSACTION_DECODER_BASE_URL:-https://decoder.atlas.arkiv-global.net/}
        VITE_TRANSACTION_EXPLORER_BASE_URL: ${VITE_TRANSACTION_EXPLORER_BASE_URL:-}
        VITE_BLOCK_TIME_MS: ${VITE_BLOCK_TIME_MS:-2000}
        VITE_STUB_TICK_MS: ${VITE_STUB_TICK_MS:-500}
        VITE_MAX_STUB_BLOCKS: ${VITE_MAX_STUB_BLOCKS:-3}
        VITE_STUB_VISIBLE_AGE_MS: ${VITE_STUB_VISIBLE_AGE_MS:-6000}
        VITE_PING_START_AGE_MS: ${VITE_PING_START_AGE_MS:-9000}
        VITE_LOADING_METADATA_LEAD_MS: ${VITE_LOADING_METADATA_LEAD_MS:-1000}
        VITE_NEXT_BLOCK_PING_MS: ${VITE_NEXT_BLOCK_PING_MS:-100}
        VITE_PING_MIN_INTERVAL_MS: ${VITE_PING_MIN_INTERVAL_MS:-1500}
        VITE_SCANNER_DELAY_WARNING_AGE_MS: ${VITE_SCANNER_DELAY_WARNING_AGE_MS:-60000}
        VITE_HISTOGRAM_WINDOW_MINUTES: ${VITE_HISTOGRAM_WINDOW_MINUTES:-60}
        VITE_HISTOGRAM_REFRESH_MS: ${VITE_HISTOGRAM_REFRESH_MS:-5000}
        VITE_HISTOGRAM_CLOCK_TICK_MS: ${VITE_HISTOGRAM_CLOCK_TICK_MS:-1000}
        VITE_NO_BATCHER: ${VITE_NO_BATCHER:-false}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 23560
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-23560}:23560"

volumes:
  pgdata:
  redisdata:
  baseloadkeys:
