x-extra-hosts: &extra-hosts
  - "host.docker.internal:${HOST_GATEWAY_IP:-0.0.0.0}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gas}
      POSTGRES_DB: ${POSTGRES_DB:-gas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SCANNER_RPC_FULL_NODE: ${SCANNER_RPC_FULL_NODE}
      SCANNER_FROM_BLOCK: ${SCANNER_FROM_BLOCK:-}
      SCANNER_TO_BLOCK: ${SCANNER_TO_BLOCK:-}
      SCANNER_OLDEST_BACKFILL_BLOCK: ${SCANNER_OLDEST_BACKFILL_BLOCK:-25000000}
      SCANNER_DISABLE_BACKFILL: true
      SCANNER_CONFIRMATION_DEPTH: ${SCANNER_CONFIRMATION_DEPTH:-3}
      SCANNER_POLL_MS: ${SCANNER_POLL_MS:-2000}
      SCANNER_RETRY_MS: ${SCANNER_RETRY_MS:-5000}
      SCANNER_TX_RECEIPT_CONCURRENCY: ${SCANNER_TX_RECEIPT_CONCURRENCY:-20}
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "scan"]

  backfill-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      SCANNER_RPC_FULL_NODE: ${SCANNER_RPC_FULL_NODE}
      SCANNER_BACKFILL_ONLY: "true"
      SCANNER_OLDEST_BACKFILL_BLOCK: ${SCANNER_OLDEST_BACKFILL_BLOCK:-25000000}
      SCANNER_BACKFILL_SLEEP_MS: ${SCANNER_BACKFILL_SLEEP_MS:-100}
      SCANNER_CONFIRMATION_DEPTH: ${SCANNER_CONFIRMATION_DEPTH:-3}
      SCANNER_POLL_MS: ${SCANNER_POLL_MS:-2000}
      SCANNER_RETRY_MS: ${SCANNER_RETRY_MS:-5000}
      SCANNER_TX_RECEIPT_CONCURRENCY: ${SCANNER_TX_RECEIPT_CONCURRENCY:-20}
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "scan"]

  batcher-collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      BATCHER_COLLECTOR_URL: ${BATCHER_COLLECTOR_URL:-}
      BATCHER_COLLECTOR_INTERVAL_MS: ${BATCHER_COLLECTOR_INTERVAL_MS:-10000}
    extra_hosts: *extra-hosts
    command:
      - sh
      - -c
      - |
        if [ -z "$${BATCHER_COLLECTOR_URL}" ]; then
          echo 'BATCHER_COLLECTOR_URL is not set; batcher collector service disabled'
          while true; do sleep 3600; done
        fi
        bun run collect-batcher

  aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      AGGREGATE_INTERVAL_MS: ${AGGREGATE_INTERVAL_MS:-30000}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "aggregate-all"]

  sender-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      SENDER_AGGREGATE_INTERVAL_MS: ${SENDER_AGGREGATE_INTERVAL_MS:-60000}
    extra_hosts: *extra-hosts
    command: ["bun", "run", "aggregate-senders"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gas}:${POSTGRES_PASSWORD:-gas}@postgres:5432/${POSTGRES_DB:-gas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVER_PORT: 3000
      SERVER_HOSTNAME: 0.0.0.0
      SAVE_TRANSACTION_DATA: ${SAVE_TRANSACTION_DATA:-false}
      BASELOAD_RPC_NODE: ${BASELOAD_RPC_NODE:-}
      BASELOAD_MNEMONIC: ${BASELOAD_MNEMONIC:-}
      BASELOAD_ADMIN_BEARER_TOKEN: ${BASELOAD_ADMIN_BEARER_TOKEN:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://scanner.arkiv-global.net}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    extra_hosts: *extra-hosts
    command: ["bun", "run", "serve"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CHAIN_NAME: ${VITE_CHAIN_NAME:-Arkiv}
        VITE_TOKEN_SYMBOL: ${VITE_TOKEN_SYMBOL:-ETH}
        VITE_TRANSACTION_EXPLORER_BASE_URL: ${VITE_TRANSACTION_EXPLORER_BASE_URL:-https://explorer.braga.hoodi.arkiv.network/tx/}
        VITE_BLOCK_TIME_MS: ${VITE_BLOCK_TIME_MS:-2000}
        VITE_STUB_TICK_MS: ${VITE_STUB_TICK_MS:-500}
        VITE_MAX_STUB_BLOCKS: ${VITE_MAX_STUB_BLOCKS:-3}
        VITE_STUB_VISIBLE_AGE_MS: ${VITE_STUB_VISIBLE_AGE_MS:-6000}
        VITE_PING_START_AGE_MS: ${VITE_PING_START_AGE_MS:-9000}
        VITE_LOADING_METADATA_LEAD_MS: ${VITE_LOADING_METADATA_LEAD_MS:-1000}
        VITE_NEXT_BLOCK_PING_MS: ${VITE_NEXT_BLOCK_PING_MS:-100}
        VITE_PING_MIN_INTERVAL_MS: ${VITE_PING_MIN_INTERVAL_MS:-1500}
        VITE_SCANNER_DELAY_WARNING_AGE_MS: ${VITE_SCANNER_DELAY_WARNING_AGE_MS:-60000}
        VITE_HISTOGRAM_WINDOW_MINUTES: ${VITE_HISTOGRAM_WINDOW_MINUTES:-60}
        VITE_HISTOGRAM_REFRESH_MS: ${VITE_HISTOGRAM_REFRESH_MS:-5000}
        VITE_HISTOGRAM_CLOCK_TICK_MS: ${VITE_HISTOGRAM_CLOCK_TICK_MS:-1000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 23560
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://scanner.arkiv-global.net}
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-23560}:23560"

volumes:
  pgdata:
  redisdata:
