# Independent native stack. Existing Ethereum compose files are unchanged.
#
# Services: postgres, producer (+ private control listener), full follower,
# light follower (the server-side verifier), scanner, backend and frontend.
# The `hosted-explorer` profile adds a second, read-only backend/frontend pair
# for a separate public origin (no controls, no login). Only the producer's
# public listener and the frontends are published, on loopback; PostgreSQL,
# the control/replication listener and the light process stay on the compose
# network.
x-native-env: &native-env
  SOURCE_KIND: native-simulator
  SIMULATOR_ALLOW_PRIVATE_HTTP: ${SIMULATOR_ALLOW_PRIVATE_HTTP:-false}
  DATABASE_URL: postgres://simulator:${SIMULATOR_DB_PASSWORD:?required}@postgres:5432/simulator
  SIMULATOR_SCHEMA: ${SIMULATOR_SCHEMA:-sim_v1}
  SIMULATOR_URL: ${SIMULATOR_URL:?required}
  SIMULATOR_SOURCE_ID: ${SIMULATOR_SOURCE_ID:?required}
  SIMULATOR_RUN_ID: ${SIMULATOR_RUN_ID:?required}
  SIMULATOR_GENESIS_HASH: ${SIMULATOR_GENESIS_HASH:?required}
  SIMULATOR_CHAIN_ID: ${SIMULATOR_CHAIN_ID:-9001}
  SIMULATOR_POLL_MS: "200"
x-api-env: &api-env
  <<: *native-env
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "3000"
  # Topology probes for the status/debug views only; the scanner never reads followers.
  SIMULATOR_FULL_URL: ${SIMULATOR_FULL_URL:-}
  SIMULATOR_LIGHT_URL: ${SIMULATOR_LIGHT_URL:-http://light:9402}
x-node-build: &node-build
  context: ${SIMULATOR_RUST_REPO:-../arkiv-db-pure-astra}
  dockerfile: Dockerfile.simulator
x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 20s
x-app-health: &app-health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15s
x-frontend-env: &frontend-env
  LOCAL_SIMULATOR_LIGHT_HOST: light
  LOCAL_SIMULATOR_LIGHT_PORT: "9402"
  # Where the /local-sim verifier runs relative to the browser. Only a
  # localhost deployment may say "local"; the default never claims it.
  VITE_SIMULATOR_VERIFIER: ${SIMULATOR_VERIFIER_LOCATION:-server}
  VITE_SIMULATOR_PUBLIC_NODE_URL: ${SIMULATOR_PUBLIC_NODE_URL:-}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: ${SIMULATOR_DB_PASSWORD:?required}
      POSTGRES_DB: simulator
    volumes: [simulator-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U simulator -d simulator]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  producer:
    profiles: [local]
    build: *node-build
    command:
      [
        producer,
        --unsigned-simulator,
        --run-dir,
        /data,
        --listen,
        "0.0.0.0:9400",
        --admin-listen,
        "0.0.0.0:9401",
        --source-id,
        "${SIMULATOR_SOURCE_ID}",
        --chain-id,
        "${SIMULATOR_CHAIN_ID:-9001}",
        --interval-ms,
        "1000",
        # Startup policy after a restart: `paused` (default) or `running`.
        --start,
        "${SIMULATOR_PRODUCER_START:-paused}",
      ]
    environment:
      SIMULATOR_ADMIN_TOKEN: ${SIMULATOR_CONTROL_TOKEN:?required}
    ports: ["127.0.0.1:${SIMULATOR_PUBLIC_PORT:-9400}:9400"]
    volumes: [simulator-node:/data]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9400/sim/v1/status"]
      <<: *node-health
    restart: unless-stopped
  full:
    # Independently re-executes every canonical body over the private
    # replication listener and checks headers/roots/outcomes before publishing.
    profiles: [local]
    build: *node-build
    command:
      [
        full,
        --unsigned-simulator,
        --run-dir,
        /data,
        --listen,
        "0.0.0.0:9403",
        --peer,
        "${SIMULATOR_URL}",
        --replication-peer,
        "http://producer:9401",
        --source-id,
        "${SIMULATOR_SOURCE_ID}",
        --run-id,
        "${SIMULATOR_RUN_ID}",
        --genesis-hash,
        "${SIMULATOR_GENESIS_HASH}",
        --chain-id,
        "${SIMULATOR_CHAIN_ID:-9001}",
      ]
    environment:
      SIMULATOR_ALLOW_PRIVATE_HTTP: ${SIMULATOR_ALLOW_PRIVATE_HTTP:-false}
      SIMULATOR_REPLICATION_TOKEN: ${SIMULATOR_CONTROL_TOKEN:?required}
    volumes: [simulator-full:/data]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9403/sim/v1/status"]
      <<: *node-health
    restart: unless-stopped
  light:
    build: *node-build
    command:
      [
        light,
        --unsigned-simulator,
        --run-dir,
        /data,
        --listen,
        "0.0.0.0:9402",
        --peer,
        "${SIMULATOR_LIGHT_PEER_URL:-${SIMULATOR_URL}}",
        --source-id,
        "${SIMULATOR_SOURCE_ID}",
        --run-id,
        "${SIMULATOR_RUN_ID}",
        --genesis-hash,
        "${SIMULATOR_GENESIS_HASH}",
        --chain-id,
        "${SIMULATOR_CHAIN_ID:-9001}",
      ]
    environment:
      SIMULATOR_ALLOW_PRIVATE_HTTP: ${SIMULATOR_ALLOW_PRIVATE_HTTP:-false}
    volumes: [simulator-light:/data]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9402/sim/v1/status"]
      <<: *node-health
    restart: unless-stopped
  scanner:
    build: .
    command: [bun, --no-env-file, run, scan]
    environment: *native-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  backend:
    build: .
    command: [bun, --no-env-file, run, serve]
    environment:
      <<: *api-env
      SIMULATOR_CONTROL_URL: ${SIMULATOR_CONTROL_URL:-}
      SIMULATOR_CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:-}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://localhost:23561}
      AUTH_INSECURE_LOCALHOST: ${AUTH_INSECURE_LOCALHOST:-false}
      AUTH_TOKEN_LOGIN_ENABLED: ${AUTH_TOKEN_LOGIN_ENABLED:-false}
      AUTH_TOKEN_LOGIN_TOKEN: ${AUTH_TOKEN_LOGIN_TOKEN:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-sieciech.czajka@golem.network}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/health || exit 1]
      <<: *app-health
    restart: unless-stopped
  frontend:
    build:
      context: frontend
      additional_contexts:
        shared: ./src
    environment:
      <<: *frontend-env
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
      # `explorer` (default) or `debug`: the view this container serves.
      VITE_UI_MODE: ${SIMULATOR_UI_MODE:-explorer}
      VITE_SIMULATOR_PEER_UI_URL: ${SIMULATOR_PEER_UI_URL:-}
    ports: ["127.0.0.1:${SIMULATOR_FRONTEND_PORT:-23561}:23560"]
    depends_on: [backend, light]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:23560/config.js || exit 1]
      <<: *app-health
    restart: unless-stopped
  explorer-backend:
    # Read-only API for a separate public explorer origin: same projection,
    # no control listener, no login configuration.
    profiles: [hosted-explorer]
    build: .
    command: [bun, --no-env-file, run, serve]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/health || exit 1]
      <<: *app-health
    restart: unless-stopped
  explorer-frontend:
    profiles: [hosted-explorer]
    build:
      context: frontend
      additional_contexts:
        shared: ./src
    environment:
      <<: *frontend-env
      BACKEND_HOST: explorer-backend
      BACKEND_PORT: "3000"
      VITE_UI_MODE: explorer
      VITE_SIMULATOR_PEER_UI_URL: ${SIMULATOR_EXPLORER_PEER_UI_URL:-}
    ports: ["127.0.0.1:${SIMULATOR_EXPLORER_FRONTEND_PORT:-23562}:23560"]
    depends_on: [explorer-backend, light]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:23560/config.js || exit 1]
      <<: *app-health
    restart: unless-stopped
volumes:
  simulator-postgres:
  simulator-node:
  simulator-full:
  simulator-light:
