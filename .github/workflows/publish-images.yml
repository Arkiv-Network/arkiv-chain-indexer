name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "APP_IMAGE=${REGISTRY}/${repo}/app" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${repo}/frontend" >> "$GITHUB_ENV"
          echo "DECODER_IMAGE=${REGISTRY}/${repo}/decoder" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: App image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Decoder image metadata
        id: decoder-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DECODER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push decoder image
        uses: docker/build-push-action@v6
        with:
          # arkiv-transaction-decoder v0.2.0 (Bun). Keep this ref in lockstep
          # with the image docker-compose.yml pins, so what a deployment runs is
          # what this repo is tested against. It replaced atlas-transaction-decoder,
          # which could not read the execute() format the chain now carries.
          context: https://github.com/Arkiv-Network/arkiv-transaction-decoder.git#48ec7606c1ea6058e938a4218c699c2a599e4154
          push: true
          tags: ${{ steps.decoder-meta.outputs.tags }}
          labels: ${{ steps.decoder-meta.outputs.labels }}
          cache-from: type=gha,scope=decoder
          cache-to: type=gha,mode=max,scope=decoder
