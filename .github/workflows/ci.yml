name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend typecheck & tests
    runs-on: ubuntu-latest
    env:
      ARKIV_JS_SDK: develop
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gas
          POSTGRES_PASSWORD: gas
          POSTGRES_DB: gas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gas -d gas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The @arkiv-network/sdk dependency is a local tarball that is gitignored;
      # build it from source the same way the Dockerfile sdk-builder stage does.
      - name: Build Arkiv SDK tarball
        run: |
          git clone https://github.com/Arkiv-Network/arkiv-sdk-js.git "$RUNNER_TEMP/arkiv-sdk-js"
          cd "$RUNNER_TEMP/arkiv-sdk-js"
          git checkout "$ARKIV_JS_SDK"
          bun install --frozen-lockfile
          bun run package:test
          mkdir -p "$GITHUB_WORKSPACE/arkiv-sdk-js"
          cp arkiv-network-sdk-latest.tgz "$GITHUB_WORKSPACE/arkiv-sdk-js/"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test
        env:
          TEST_DATABASE_URL: postgres://gas:gas@localhost:5432/gas

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs `tsc -b` first, so this covers the type/language check.
      - name: Typecheck and build
        run: npm run build
