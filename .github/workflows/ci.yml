name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gas
          POSTGRES_PASSWORD: gas
          POSTGRES_DB: gas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gas -d gas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      # Scope to backend tests: the frontend tests live under frontend/ and
      # import .tsx modules that need React (installed only in the frontend job).
      - name: Run tests
        run: bun test src
        env:
          TEST_DATABASE_URL: postgres://gas:gas@localhost:5432/gas

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      # The wire-format contract test (frontend/apiWireFormat.test.ts) imports
      # the backend's src/server.ts to pin both halves of the API together, so
      # the root dependencies (viem, the SDK, commander) must be present too.
      - name: Install backend dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      # `build` runs `tsc -b` first, so this covers the type/language check.
      - name: Typecheck and build
        run: npm run build

      # Frontend tests run here (not in the backend job) because they import
      # .tsx modules that resolve React from frontend/node_modules. The
      # cross-package contract test additionally resolves backend imports from
      # the root node_modules installed above.
      - name: Run tests
        run: bun test
